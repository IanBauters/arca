<title>Arca Software Vault</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: App Store–style shell — fixed sidebar, header with search, content + right rail. Collapses to a bottom tab bar on phones. */
:root {
  --ink: #000000;          /* primary text */
  --muted: #88949d;        /* secondary text, icons */
  --accent: #409cff;       /* actions, active nav */
  --surface: #ffffff;      /* app surface */
  --page: #eceef1;         /* behind the app window */
  --tile: #f5f6f8;         /* category tiles, inputs */
  --line: #eceef0;
  --card: #ffffff;
  --accent-soft: #eaf3ff;
  --good: #1f9d55; --good-soft: #e6f6ec;
  --warn: #b7791f; --warn-soft: #fdf3e2;
  --bad: #d64545;  --bad-soft: #fdeaea;
  --shadow: 0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
  --hero-ink: #ffffff;
  --font: -apple-system, "SF Pro Display", "SF Pro Text", BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
  --mono: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
  --r-lg: 18px; --r-md: 12px; --r-sm: 9px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ink: #f3f5f7; --muted: #8e99a2; --accent: #409cff; --surface: #101218; --page: #07070f; --tile: #1a1d25;
  --line: #22252e; --card: #161922; --accent-soft: #15253a; --good: #48c27a; --good-soft: #13281c;
  --warn: #e0a84a; --warn-soft: #2b2212; --bad: #f06b6b; --bad-soft: #2e1515;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --ink: #f3f5f7; --muted: #8e99a2; --accent: #409cff; --surface: #101218; --page: #07070f; --tile: #1a1d25;
  --line: #22252e; --card: #161922; --accent-soft: #15253a; --good: #48c27a; --good-soft: #13281c;
  --warn: #e0a84a; --warn-soft: #2b2212; --bad: #f06b6b; --bad-soft: #2e1515;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* window */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); height: 100%; background: var(--surface); }
@media (min-width: 1280px) {
  body { padding: 20px max(20px, env(safe-area-inset-right, 0px)) 20px max(20px, env(safe-area-inset-left, 0px)); }
  .app { max-width: 1480px; margin: 0 auto; border-radius: 28px; overflow: hidden; box-shadow: 0 30px 80px rgba(16,24,40,.12); }
}

/* sidebar */
.side { display: flex; flex-direction: column; gap: 6px; padding: 28px 14px 20px; border-right: 1px solid var(--line); min-height: 0; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 12px; padding: 0 10px 26px; font-size: 21px; font-weight: 600; letter-spacing: -.01em; }
.logo { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; color: #fff; background: linear-gradient(160deg, #5fb3ff, #2f7cf6); box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
.logo svg { width: 22px; height: 22px; stroke-width: 2; }
.nav { display: flex; align-items: center; gap: 14px; padding: 11px 14px; border: 0; background: none; border-radius: var(--r-sm); text-align: left; color: var(--ink); font-size: 15px; }
.nav svg { color: var(--muted); }
.nav:hover { background: var(--tile); }
.nav.on { background: var(--accent); color: #fff; font-weight: 600; box-shadow: 0 6px 16px rgba(64,156,255,.35); }
.nav.on svg { color: #fff; }
.nav .badge { margin-left: auto; font-size: 12px; color: var(--muted); }
.nav.on .badge { color: rgba(255,255,255,.85); }
.side-spacer { flex: 1; min-height: 20px; }
.store-card { border-radius: var(--r-md); padding: 18px 16px 16px; color: #fff; background: linear-gradient(150deg, #ff5e7e 0%, #d65ad1 55%, #8f6cf0 100%); display: grid; gap: 10px; }
.store-card h4 { margin: 0; font-size: 20px; line-height: 1.15; font-weight: 600; letter-spacing: -.01em; }
.store-card p { margin: 0; font-size: 12.5px; opacity: .9; }
.bar { height: 6px; border-radius: 99px; background: rgba(255,255,255,.3); overflow: hidden; }
.bar > i { display: block; height: 100%; background: #fff; border-radius: inherit; }
.store-card button { border: 0; background: #fff; color: #111; border-radius: 99px; padding: 9px 14px; font-weight: 600; font-size: 13px; }
.logout { margin-top: 14px; }

/* main */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow-y: auto; }
.head { display: flex; align-items: center; gap: 14px; padding: 30px 40px 22px; margin: 0 0 0; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 5; }
.head h1 { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -.02em; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.back { border: 0; background: var(--tile); width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; }
.sq { width: 44px; height: 44px; border-radius: 12px; border: 0; background: var(--tile); display: grid; place-items: center; color: var(--ink); position: relative; }
.sq.primary { background: var(--accent); color: #fff; }
.search { display: flex; align-items: center; gap: 10px; background: var(--tile); border-radius: 12px; padding: 0 14px; height: 44px; width: min(280px, 34vw); color: var(--muted); }
.search input { border: 0; background: none; outline: none; flex: 1; min-width: 0; font-size: 15px; color: var(--ink); }
.avatar { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-weight: 600; color: #fff; background: linear-gradient(140deg, #2b3140, #4a5468); }
.content { padding: 30px 40px 48px; }
.demo-note { margin: 0 40px; margin-top: 18px; padding: 10px 14px; border-radius: var(--r-sm); background: var(--accent-soft); color: var(--ink); font-size: 13px; display: flex; gap: 10px; align-items: center; }
.demo-note svg { color: var(--accent); }

/* overview */
.ov { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 30px; align-items: start; }
.hero { position: relative; border-radius: var(--r-lg); overflow: hidden; min-height: 320px; display: flex; flex-direction: column; justify-content: flex-end; color: var(--hero-ink); background: #0d1220; cursor: pointer; }
.hero-art { position: absolute; inset: 0; background-size: cover; background-position: center; }
.hero-art .glyph { position: absolute; right: 7%; top: 30px; width: 136px; height: 136px; border-radius: 34px; display: grid; place-items: center; font-size: 56px; font-weight: 700; color: #fff; box-shadow: 0 24px 60px rgba(0,0,0,.45); }
.hero-info { position: relative; display: flex; align-items: flex-end; gap: 20px; padding: 22px 24px; background: linear-gradient(180deg, rgba(10,14,26,0), rgba(10,14,26,.78) 45%); }
.hero-info > div { flex: 1; min-width: 0; }
.eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); }
.hero h2 { margin: 4px 0 6px; font-size: 25px; font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
.hero p { margin: 0; font-size: 13.5px; opacity: .85; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.btn { border: 0; border-radius: 99px; padding: 11px 22px; background: var(--accent); color: #fff; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.btn:hover { filter: brightness(1.06); }
.btn.ghost { background: var(--tile); color: var(--ink); }
.btn.soft { background: var(--accent-soft); color: var(--accent); }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn.sm { padding: 7px 14px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
.sec { margin-top: 34px; }
.ov-main > .sec:first-child { margin-top: 0; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; gap: 12px; }
.sec-h h3 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
.link { border: 0; background: none; color: var(--accent); font-size: 13.5px; padding: 0; }
.ov-main { container-type: inline-size; min-width: 0; }
.cats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.cards.recent { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@container (min-width: 520px) { .cards.recent { grid-template-columns: repeat(3, minmax(0, 1fr)); } .cards.recent > :nth-child(n+7) { display: none; } }
@container (min-width: 740px) { .cats, .cards.recent { grid-template-columns: repeat(4, minmax(0, 1fr)); } .cards.recent > :nth-child(n+7) { display: flex; } }
.cat { display: flex; align-items: center; gap: 10px; padding: 16px 14px; min-width: 0; border-radius: var(--r-md); border: 0; background: var(--tile); font-size: 14.5px; font-weight: 500; text-align: left; color: var(--ink); }
.cat svg { color: var(--muted); width: 20px; height: 20px; }
.cat .cn { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat .pill { margin-left: auto; min-width: 24px; padding-inline: 7px; justify-content: center; }
.cat:hover, .cat.on { background: var(--accent-soft); }
.cat.on { color: var(--accent); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 18px; }
.cards.row { grid-auto-flow: column; grid-template-columns: none; grid-auto-columns: minmax(190px, 212px); overflow-x: auto; padding: 4px 4px 18px; margin: -4px -4px -18px; scroll-snap-type: x mandatory; }
.card { background: var(--card); border-radius: var(--r-md); padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; cursor: pointer; scroll-snap-align: start; border: 1px solid transparent; transition: transform .15s ease; }
.card:hover { transform: translateY(-2px); }
.card .art { aspect-ratio: 1; width: 100%; max-width: 100%; border-radius: 12px; overflow: hidden; }
.card h4 { margin: 2px 0 0; font-size: 15.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 13px; min-width: 0; }
.card .meta > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 99px; padding: 3px 10px; font-size: 12px; font-weight: 600; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.pill.grey { background: var(--tile); color: var(--muted); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.panel { background: var(--card); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 20px; }
.panel + .panel { margin-top: 20px; }
.dgrid > .panel + .panel { margin-top: 0; }
.panel-h { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
.panel-h h3 { margin: 0; font-size: 18px; font-weight: 600; }
.lrow { display: flex; align-items: center; gap: 12px; padding: 9px 0; cursor: pointer; }
.lrow + .lrow { border-top: 1px solid var(--line); }
.lrow .ic { width: 44px; height: 44px; border-radius: 11px; overflow: hidden; flex: none; }
.lrow .tx { flex: 1; min-width: 0; }
.lrow .tx b { display: block; font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow .tx span { color: var(--muted); font-size: 12.5px; }
.lrow > .pill { min-width: 78px; justify-content: center; flex: none; }
.health { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.stat { background: var(--tile); border-radius: var(--r-sm); padding: 12px; }
.stat b { display: block; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.progress { height: 6px; border-radius: 99px; background: var(--tile); overflow: hidden; margin: 10px 0 4px; }
.progress > i { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width .2s; }
.hint { color: var(--muted); font-size: 12.5px; }

/* icons */
.ico { width: 100%; height: 100%; display: grid; place-items: center; color: #fff; font-weight: 700; letter-spacing: -.02em; position: relative; overflow: hidden; }
.ico img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ico::after { content: ""; position: absolute; inset: 0; background: radial-gradient(120% 80% at 20% 0%, rgba(255,255,255,.28), rgba(255,255,255,0) 55%); pointer-events: none; }
.ico.has-img::after { display: none; }
/* Uploaded icons keep their own shape (classic Mac OS X icons are rarely rounded squares):
   no crop, no clip, transparency preserved, shadow follows the artwork's outline. */
.ico.has-img { overflow: visible; background: none; }
.ico.has-img img { object-fit: contain; filter: drop-shadow(0 2px 3px rgba(16,24,40,.22)); }
:is(.card .art, .lrow .ic, .krow .ic, .dhead .big):has(> .ico.has-img) { border-radius: 0; overflow: visible; box-shadow: none; background: none; }
.card .art:has(> .ico.has-img) { background: var(--tile); border-radius: 12px; padding: 14%; }
.card .art:has(> .ico.has-img) img { filter: drop-shadow(0 6px 10px rgba(16,24,40,.25)); }

/* library */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 22px; }
.chip { border: 0; border-radius: 99px; padding: 8px 14px; background: var(--tile); color: var(--ink); font-size: 13.5px; font-weight: 500; }
.chip.on { background: var(--accent); color: #fff; }
.sel { border: 0; border-radius: 99px; padding: 8px 14px; background: var(--tile); font-size: 13.5px; margin-left: auto; }

/* detail */
.dhead { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
.dhead .big { width: 120px; height: 120px; border-radius: 27px; overflow: hidden; box-shadow: var(--shadow); flex: none; font-size: 40px; }
.dhead .who { flex: 1; min-width: 220px; }
.dhead h2 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -.02em; text-wrap: balance; }
.dhead .sub { color: var(--muted); font-size: 15px; margin: 2px 0 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.dactions { display: flex; gap: 10px; flex-wrap: wrap; }
.dgrid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 30px; margin-top: 34px; align-items: start; }
.ver { background: var(--card); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 18px 20px; }
.ver + .ver { margin-top: 16px; }
.ver-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ver-h h4 { margin: 0; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.ver-h .tools { margin-left: auto; display: flex; gap: 4px; }
.ibtn { border: 0; background: none; width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: var(--muted); }
.ibtn:hover { background: var(--tile); color: var(--ink); }
.ver .notes { margin: 8px 0 0; color: var(--muted); font-size: 13.5px; white-space: pre-wrap; }
.files { margin-top: 14px; display: grid; gap: 8px; }
.file { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--tile); border-radius: var(--r-md); padding: 10px 12px; }
.file .k { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--surface); color: var(--muted); }
.file .n b { display: block; font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file .n span { color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.file .acts { display: flex; gap: 4px; align-items: center; }
.hash { border: 0; background: none; padding: 0; color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
.hash:hover { color: var(--accent); }
.empty-files { border: 1.5px dashed var(--line); border-radius: var(--r-md); padding: 16px; text-align: center; color: var(--muted); font-size: 13.5px; margin-top: 14px; }
.key { background: var(--tile); border-radius: var(--r-md); padding: 12px 14px; }
.key + .key { margin-top: 10px; }
.key-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.key-top b { font-size: 13.5px; }
.key-val { font-family: var(--mono); font-size: 14px; margin: 8px 0 6px; word-break: break-all; letter-spacing: .02em; }
.key-meta { color: var(--muted); font-size: 12px; }
.compat { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; }
.compat + .compat { border-top: 1px solid var(--line); }
.compat b { font-weight: 500; font-size: 13.5px; }
.compat span { display: block; color: var(--muted); font-size: 12px; }
.about { color: var(--ink); font-size: 14px; white-space: pre-wrap; margin: 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin-top: 12px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

/* keys list */
.klist { display: grid; gap: 10px; }
.krow { display: grid; grid-template-columns: 48px minmax(0, 1.2fr) minmax(0, 1.4fr) auto; gap: 16px; align-items: center; background: var(--card); box-shadow: var(--shadow); border-radius: var(--r-md); padding: 12px 14px; }
.krow .ic { width: 48px; height: 48px; border-radius: 12px; overflow: hidden; cursor: pointer; }
.krow .t b { display: block; font-weight: 600; }
.krow .t span { color: var(--muted); font-size: 12.5px; }

/* devices */
.dcard { background: var(--card); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 18px; cursor: pointer; display: flex; gap: 14px; align-items: center; }
.dcard .dk { width: 52px; height: 52px; border-radius: 13px; background: var(--tile); display: grid; place-items: center; color: var(--ink); }
.dcard .dk svg { width: 26px; height: 26px; }
.dcard b { display: block; font-size: 16px; font-weight: 600; }
.dcard span { color: var(--muted); font-size: 13px; }

/* settings */
.set { display: grid; gap: 20px; max-width: 760px; }
.seg { display: inline-flex; background: var(--tile); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: none; padding: 7px 16px; border-radius: 8px; font-size: 13.5px; }
.seg button.on { background: var(--card); box-shadow: var(--shadow); font-weight: 600; }
.set p { margin: 0 0 12px; color: var(--muted); max-width: 62ch; }

/* empty state */
.empty { text-align: center; padding: 50px 20px; border-radius: var(--r-lg); background: var(--tile); }
.empty h3 { margin: 12px 0 6px; font-size: 20px; }
.empty p { margin: 0 auto 18px; color: var(--muted); max-width: 46ch; }
.empty .logo { margin: 0 auto; width: 56px; height: 56px; border-radius: 15px; }
.empty .logo svg { width: 30px; height: 30px; }

/* modal */
.scrim { position: fixed; inset: 0; background: rgba(8,10,16,.45); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); display: grid; place-items: center; z-index: 50; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { width: min(560px, 100%); max-height: 100%; overflow-y: auto; background: var(--surface); border-radius: 22px; box-shadow: 0 30px 80px rgba(0,0,0,.3); padding: 24px; }
.modal h3 { margin: 0 0 4px; font-size: 21px; font-weight: 600; letter-spacing: -.01em; }
.modal .lead { margin: 0 0 18px; color: var(--muted); font-size: 13.5px; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.f { display: grid; gap: 6px; }
.f.full { grid-column: 1 / -1; }
.f label { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.f input, .f select, .f textarea { border: 1px solid transparent; background: var(--tile); border-radius: 10px; padding: 10px 12px; font-size: 14.5px; outline: none; width: 100%; min-width: 0; }
.f textarea { min-height: 84px; resize: vertical; }
.f input:focus, .f select:focus, .f textarea:focus { border-color: var(--accent); }
.f .mono-in { font-family: var(--mono); }
.mfoot { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; flex-wrap: wrap; }
.mfoot .left { margin-right: auto; }
.drop { border: 1.5px dashed var(--muted); border-radius: var(--r-md); padding: 26px 16px; text-align: center; color: var(--muted); cursor: pointer; display: grid; gap: 6px; justify-items: center; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

async function refreshChrome() {
  try {
    const s = await api('GET', 'api/stats'); S.stats = s;
    $('#badge-library').textContent = s.apps || '';
    $('#badge-keys').textContent = s.licenses || '';
    $('#badge-devices').textContent = s.devices || '';
    const used = s.disk ? s.disk.total - s.disk.free : 0;
    const pct = s.disk ? Math.round(used / s.disk.total * 100) : 0;
    $('#storeCard').innerHTML = `
      <h4>${fmtSize(s.size)}<br>safely archived</h4>
      <p class="num">${s.files} files across ${s.versions} versions${s.disk ? ` · ${fmtSize(s.disk.free)} free on the volume` : ''}</p>

      <button data-act="new-app">Add software</button>`;

}

function go(v, params = {}) {
  S.route = { v, ...params };
  if (!S.demo) { const h = v + (params.id ? '/' + params.id : ''); if (location.hash.slice(1) !== h) history.pushState(null, '', '#' + h); }
  render();
}
async function render() {
  NAV.forEach(n => $('#nav-' + n.v)?.classList.toggle('on', n.v === S.route.v || (S.route.v === 'app' && n.v === 'library') || (S.route.v === 'device' && n.v === 'devices')));
  $('#backBtn').hidden = !['app', 'device'].includes(S.route.v);
  const view = $('#view');
  try {
    const fn = Views[S.route.v] || Views.overview;
    const html = await fn();
    view.innerHTML = html;
    Views['after_' + S.route.v]?.();
  } catch (e) {
    view.innerHTML = `<div class="empty"><h3>Something went wrong</h3><p>${esc(e.message)}</p><button class="btn" data-act="go" data-v="overview">Back to Overview</button></div>`;

function verifyBox(v, s) {
  if (v.running) { const pct = v.total ? Math.round(v.done / v.total * 100) : 0; return `<div class="progress"><i style="width:${pct}%"></i></div><p class="hint num">Checking ${v.done} of ${v.total} files…</p>`; }
  const bad = v.bad?.length ? `<div style="margin-bottom:10px">${v.bad.map(b => `<div class="compat"><div><b>${esc(b.name)}</b><span>${esc(b.app)}</span></div><span class="pill bad">${b.status === 'missing' ? 'Missing' : 'Changed'}</span></div>`).join('')}</div>` : '';
  return `${bad}<button class="btn soft sm" data-act="verify" style="width:100%;justify-content:center">${ic('shield')} Verify all checksums</button><p class="hint" style="margin:8px 0 0;text-align:center">Last check ${ago(s.last_verify || v.finished_at)}</p>`;
}
async function pollVerify() {
  clearTimeout(S._vp);
  const v = await api('GET', 'api/verify').catch(() => null);
  if (!v) return;
  const box = $('#verifyBox');
  if (box) box.innerHTML = verifyBox(v, { last_verify: v.finished_at });
  if (v.running) S._vp = setTimeout(pollVerify, 600);
  else { refreshChrome(); if (box) toast(v.bad?.length ? `${v.bad.length} file(s) need attention` : `All ${v.total} files verified`); }
}

/* ============ modals & forms ============ */
function field(f, val) {
  const v = val ?? f.value ?? '';
  const id = 'f_' + f.name;
  let input;
  if (f.type === 'select') input = `<select id="${id}" name="${f.name}">${f.options.map(o => `<option ${String(o) === String(v) ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  else if (f.type === 'textarea') input = `<textarea id="${id}" name="${f.name}" placeholder="${esc(f.ph || '')}">${esc(v)}</textarea>`;
  else if (f.type === 'checkbox') return `<label class="f full" style="display:flex;gap:10px;align-items:center;font-size:14px;color:var(--ink)"><input type="checkbox" id="${id}" name="${f.name}" ${v ? 'checked' : ''} style="width:auto"> ${esc(f.label)}</label>`;
  else input = `<input id="${id}" name="${f.name}" type="${f.type || 'text'}" value="${f.type === 'file' ? '' : esc(v)}" placeholder="${esc(f.ph || '')}" ${f.accept ? `accept="${f.accept}"` : ''} ${f.mono ? 'class="mono-in"' : ''} ${f.required ? 'required' : ''} autocomplete="off">`;
  return `<div class="f ${f.full ? 'full' : ''}"><label for="${id}">${esc(f.label)}</label>${input}</div>`;
}
function modal({ title, lead = '', fields = [], values = {}, body = '', submit = 'Save', danger, onSubmit, onDanger }) {
  closeModal();
  const el = document.createElement('div');
  el.className = 'scrim'; el.id = 'modal';
  el.innerHTML = `<form class="modal" novalidate role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h3 id="mTitle">${esc(title)}</h3>${lead ? `<p class="lead">${lead}</p>` : '<div style="height:14px"></div>'}
    ${fields.length ? `<div class="fields">${fields.map(f => field(f, values[f.name])).join('')}</div>` : ''}
    ${body}
    <p class="hint" id="mErr" style="color:var(--bad);margin:12px 0 0" hidden></p>
    <div class="mfoot">${danger ? `<button type="button" class="btn danger left" id="mDanger">${esc(danger)}</button>` : ''}<button type="button" class="btn ghost" data-act="close">Cancel</button>${submit ? `<button type="submit" class="btn" id="mSubmit">${esc(submit)}</button>` : ''}</div>
  </form>`;
  document.body.appendChild(el);
  const form = el.querySelector('form');
  el.addEventListener('mousedown', (e) => { if (e.target === el) closeModal(); });
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const data = {}; fields.forEach(f => { const inp = form.elements[f.name]; data[f.name] = f.type === 'checkbox' ? inp.checked : f.type === 'file' ? inp.files[0] : inp.value.trim(); });
    const btn = $('#mSubmit'); btn.disabled = true;
    try { await onSubmit(data, form); } catch (err) { const m = $('#mErr'); m.textContent = err.message; m.hidden = false; btn.disabled = false; }
  });
  if (danger) $('#mDanger').addEventListener('click', () => onDanger());
  setTimeout(() => form.querySelector('input:not([type=checkbox]),textarea,select')?.focus(), 30);
  return form;
}
function closeModal() { $('#modal')?.remove(); }
function confirmBox(title, text, action, fn) {
  modal({ title, lead: text, submit: action, onSubmit: async () => { await fn(); closeModal(); } });
  $('#mSubmit').classList.add('danger');
  $('#mSubmit').style.cssText = 'background:var(--bad);color:#fff';
}

function uploadModal(versionId) {
  const v = S.app.versions.find(x => x.id === versionId) || { version: '' };
  let picked = [];
  const form = modal({
    title: `Upload files${v.version ? ' for ' + v.version : ''}`,
    lead: 'Files are streamed straight to the NAS and fingerprinted with SHA-256 on the way in. There is no size limit.',
    fields: [{ name: 'kind', label: 'What is it?', type: 'select', options: Object.keys(KINDS), full: true }],
    body: `<div class="drop" id="drop" tabindex="0" style="margin-top:14px">${ic('upload')}<b>Drop files here</b><span>or click to choose</span><input type="file" id="fileIn" multiple hidden></div>
      <div class="picked" id="picked"></div>
      <div class="progress" id="upProg" hidden><i style="width:0"></i></div><p class="hint num" id="upTxt" hidden></p>
      <div class="tip">${ic('info')}<span>Archive a Mac app the way Apple's backup note describes: select it in Applications, choose <b>File › Compress</b>, and upload the .zip. That keeps the signature and App Store receipt intact.</span></div>`,
    submit: 'Upload',
    onSubmit: async (d) => {
      if (!picked.length) throw new Error('Choose at least one file');
      const fd = new FormData(); fd.append('kind', d.kind); picked.forEach(f => fd.append('file', f, f.name));
      const total = picked.reduce((s, f) => s + f.size, 0);
      $('#upProg').hidden = false; $('#upTxt').hidden = false;
      await uploadForm(`api/versions/${versionId}/files`, fd, (p) => { $('#upProg i').style.width = (p * 100).toFixed(1) + '%'; $('#upTxt').textContent = p >= 1 ? 'Computing checksum…' : `${fmtSize(total * p)} of ${fmtSize(total)}`; });
      closeModal(); toast(`${picked.length} file${picked.length === 1 ? '' : 's'} archived`); refreshChrome(); render();
    },
  });
  form.elements.kind.innerHTML = Object.entries(KINDS).map(([k, [l]]) => `<option value="${k}">${l}</option>`).join('');
  const drop = $('#drop'), inp = $('#fileIn');
  const show = () => { $('#picked').innerHTML = picked.map(f => `<div><span>${esc(f.name)}</span><span class="num hint">${fmtSize(f.size)}</span></div>`).join(''); };
  const add = (list) => { picked = [...picked, ...list]; show(); };
  drop.addEventListener('click', () => inp.click());
  drop.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); inp.click(); } });
  inp.addEventListener('change', () => add([...inp.files]));
  drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('over'); const fl = [...e.dataTransfer.files].filter(f => f.size || f.type); add(fl); if (fl.length < e.dataTransfer.files.length) toast('Folders and .app bundles must be zipped first'); });
}
function keyModal(existing) {
  modal({
    title: existing ? 'Edit license key' : `License key for ${S.app.name}`,
    lead: existing ? 'Leave the key empty to keep the current one.' : 'Stored encrypted with AES-256-GCM. Only shown when you reveal it.',
    fields: [
      { name: 'key', label: 'Key, serial or purchase reference', full: true, mono: true, ph: 'XXXXX-XXXXX-XXXXX-XXXXX', required: !existing },
      { name: 'label', label: 'Label', ph: 'Retail box serial' },
      { name: 'source', label: 'Bought from', ph: 'Mac App Store, retail disc…' },
      { name: 'registered_to', label: 'Registered to', ph: 'Name' },
      { name: 'email', label: 'Account email', type: 'email' },
      { name: 'purchased', label: 'Purchase date', type: 'date' },
      { name: 'notes', label: 'Notes', type: 'textarea', full: true, ph: 'Seats, upgrade path, where the box is kept…' },
    ],
    values: existing ? { ...existing, key: '' } : {},
    danger: existing ? 'Delete key' : null,
    onDanger: () => confirmBox('Delete this key?', 'The encrypted key is removed from the vault.', 'Delete key', async () => { await api('DELETE', 'api/licenses/' + existing.id); delete S.revealed[existing.id]; refreshChrome(); render(); }),
    onSubmit: async (d) => {
      if (existing) await api('PUT', 'api/licenses/' + existing.id, d); else await api('POST', `api/apps/${S.app.id}/licenses`, d);
      if (existing) delete S.revealed[existing.id];
      closeModal(); toast(existing ? 'Key updated' : 'Key saved'); refreshChrome(); render();
    },
  });
}
function deviceModal(existing) {
  modal({
    title: existing ? 'Edit device' : 'Add a device',
    lead: 'Use the OS version as shown in About This Mac or winver, for example 12.7.6.',
    fields: [
      { name: 'name', label: 'Name', ph: 'Mac Pro (Late 2013)', full: true, required: true },
      { name: 'platform', label: 'Platform', type: 'select', options: PLATFORMS },
      { name: 'os_version', label: 'OS version', ph: '12.7.6' },
      { name: 'model', label: 'Model identifier', ph: 'MacPro6,1', full: true },
      { name: 'notes', label: 'Notes', type: 'textarea', full: true },
    ],
    values: existing || {},
    danger: existing ? 'Delete device' : null,
    onDanger: () => confirmBox(`Delete ${existing.name}?`, 'Only the device is removed. Your archived software stays.', 'Delete device', async () => { await api('DELETE', 'api/devices/' + existing.id); refreshChrome(); go('devices'); }),
    onSubmit: async (d) => {
      const r = existing ? await api('PUT', 'api/devices/' + existing.id, d) : await api('POST', 'api/devices', d);
      closeModal(); refreshChrome(); existing ? render() : go('device', { id: r.id });
    },
  });
}

/* ============ actions ============ */
document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  try {
    switch (act) {
      case 'go': S.filter.category = ''; go(el.dataset.v); break;
      case 'back': history.length > 1 && !S.demo ? history.back() : go(S.route.v === 'device' ? 'devices' : 'library'); break;
      case 'cat': S.filter.category = el.dataset.c; go('library'); break;
      case 'open-app': go('app', { id }); break;
      case 'open-device': go('device', { id }); break;
      case 'new-app': appModal(); break;
      case 'edit-app': appModal(S.app); break;
      case 'new-version': versionModal(); break;
      case 'edit-version': versionModal(S.app.versions.find(v => v.id === id)); break;
      case 'del-version': { const v = S.app.versions.find(x => x.id === id); confirmBox(`Delete version ${v.version}?`, `${v.files.length} file(s), ${fmtSize(v.files.reduce((s, f) => s + f.size, 0))}, will be removed from the NAS.`, 'Delete version', async () => { await api('DELETE', 'api/versions/' + id); toast('Version deleted'); refreshChrome(); render(); }); break; }
      case 'upload': uploadModal(id); break;
      case 'del-file': { const f = S.app.versions.flatMap(v => v.files).find(x => x.id === id); confirmBox(`Delete ${f.original_name}?`, `${fmtSize(f.size)} will be removed from the NAS.`, 'Delete file', async () => { await api('DELETE', 'api/files/' + id); toast('File deleted'); refreshChrome(); render(); }); break; }
      case 'download': download(id); break;
      case 'new-key': keyModal(); break;
      case 'edit-key': keyModal(S.app.licenses.find(l => l.id === id)); break;
      case 'reveal': {
        if (S.revealed[id]) delete S.revealed[id]; else S.revealed[id] = (await api('GET', `api/licenses/${id}/reveal`)).key;
        render(); break;
      }
      case 'copy-key': { const k = S.revealed[id] || (await api('GET', `api/licenses/${id}/reveal`)).key; copyText(k, 'Key copied'); break; }
      case 'copy': copyText(el.dataset.text, 'Checksum copied'); break;
      case 'new-device': deviceModal(); break;
      case 'edit-device': deviceModal(S.device); break;
      case 'verify': await api('POST', 'api/verify'); pollVerify(); break;
      case 'theme': store.set('theme', el.dataset.t); applyTheme(); render(); break;
      case 'export': if (S.demo) toast('Export works once Arca runs on your NAS'); else location.href = 'api/export'; break;
      case 'close': closeModal(); break;
      case 'logout': await api('POST', 'api/logout'); location.reload(); break;
    }
  } catch (err) { toast(err.message); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && e.target.matches('[data-act="open-app"],[data-act="open-device"]') && e.target.tagName !== 'BUTTON') e.target.click();
  if (e.key === '/' && !e.target.closest('input,textarea,select')) { e.preventDefault(); $('#search')?.focus(); }
});
window.addEventListener('popstate', () => { if (S.demo) return; const [v, id] = location.hash.slice(1).split('/'); S.route = { v: v || 'overview', id }; render(); });

function applyTheme() { const t = store.get('theme', 'auto'); if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t); }

function renderLogin() {
  closeModal();
  $('#root').innerHTML = `<div class="login"><form id="loginForm">
    <span class="logo" style="margin:0 auto;width:56px;height:56px;border-radius:15px">${ic('vault')}</span>
    <h2>Arca</h2><p>Sign in to your software vault</p>
    <div class="f"><input type="password" id="pw" placeholder="Password" autocomplete="current-password" aria-label="Password"></div>
    <p class="hint" id="pwErr" style="color:var(--bad);margin:0" hidden></p>
    <button class="btn" style="justify-content:center">Sign in</button></form></div>`;
  $('#pw').focus();
  $('#loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    try { await api('POST', 'api/login', { password: $('#pw').value }); boot(); }
    catch (err) { const m = $('#pwErr'); m.textContent = err.message; m.hidden = false; }
  });
}

async function boot() {
  applyTheme();
  try {
    const r = await fetch('api/health', { credentials: 'same-origin' });
    const h = await r.json();
    if (h.app !== 'arca') throw 0;
    S.auth = h.auth_required;
    if (h.auth_required && !h.authenticated) return renderLogin();
  } catch { S.demo = true; }
  shell();
  if (!S.demo && location.hash) { const [v, id] = location.hash.slice(1).split('/'); S.route = { v, id }; }
  refreshChrome();
  render();
}
boot();
</script>
